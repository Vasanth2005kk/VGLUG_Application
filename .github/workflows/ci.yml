# Continuous integration: lint, test and build the backend, frontend and Docker stack.
# Runs on every push to main and on every pull request. Other workflows (e.g. a deployment)
# can reuse it with `uses: ./.github/workflows/ci.yml`, so they only proceed when it passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: "Lint (ruff: syntax errors, undefined names, unused imports)"
        run: uvx ruff@0.14.0 check --select E4,E7,E9,F --output-format=github .

      - name: Start a disposable PostgreSQL 16
        # Random per-run credentials; the database exists only for this job.
        run: |
          PGPASS="$(openssl rand -hex 24)"
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PGPASS"
          echo "::add-mask::$SECRET"
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER=vglug -e POSTGRES_PASSWORD="$PGPASS" -e POSTGRES_DB=vglug_test \
            --health-cmd "pg_isready -U vglug -d vglug_test" --health-interval 2s --health-retries 30 \
            postgres:16
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ci-postgres)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ci-postgres)" = healthy ] \
            || { echo "::error title=PostgreSQL::Test database did not become healthy"; docker logs ci-postgres; exit 1; }
          {
            echo "TEST_DATABASE_URL=postgresql+psycopg://vglug:$PGPASS@127.0.0.1:5432/vglug_test"
            echo "DATABASE_URL=postgresql+psycopg://vglug:$PGPASS@127.0.0.1:5432/vglug_test"
            echo "SECRET_KEY=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Apply migrations to an empty database
        run: uv run flask --app wsgi db upgrade

      - name: Check models and migrations are in sync
        run: |
          uv run flask --app wsgi db check \
            || { echo "::error title=Migrations::app/models.py has changes without a migration. Run 'flask db migrate' and commit the result."; exit 1; }

      - name: Run tests (pytest against PostgreSQL)
        run: uv run pytest -q -rf

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint -- --format=github

      - name: Run tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker (compose config, image build, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh backend/docker-entrypoint.sh backend/scripts/*.sh .github/scripts/*.sh

      - name: Create .env with random per-run secrets
        run: |
          cp .env.example .env
          for key in SECRET_KEY POSTGRES_PASSWORD INITIAL_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            [ "$key" = INITIAL_ADMIN_PASSWORD ] && value="Ci-${value}!"
            echo "::add-mask::$value"
            sed -i "s|^${key}=.*|${key}=${value}|" .env
          done

      - name: Validate docker-compose.yml
        run: docker compose config --quiet && echo "docker-compose.yml is valid"

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: |
          docker compose up -d --wait --wait-timeout 180 \
            || { echo "::error title=Docker::Stack did not become healthy. See the 'Container logs' step."; exit 1; }

      - name: Smoke test (pages, API, upload, persistence, backup/restore)
        run: .github/scripts/docker-smoke-test.sh

      - name: Container logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
